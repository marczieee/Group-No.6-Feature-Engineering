name: Feature Engineering CI/CD Pipeline

on:
  push:
    paths:
      - 'input/*.csv'
      - '**/*.py'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      force_process:
        description: 'Force process even if files unchanged'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  feature-engineering:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn matplotlib seaborn
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: List files
      run: |
        echo "📁 Python files in repository:"
        ls -la *.py 2>/dev/null || echo "No Python files found"
        echo ""
        echo "📂 Input directory contents:"
        ls -la input/ 2>/dev/null || echo "No input directory"
    
    - name: Determine input file
      id: input-file
      run: |
        # Look for CSV files
        if [ -d "input" ] && [ -n "$(ls -A input/*.csv 2>/dev/null)" ]; then
          INPUT_FILE=$(ls input/*.csv | head -1)
          echo "Found CSV file: $INPUT_FILE"
        else
          # Look anywhere in repo
          CSV_FILES=$(find . -name "*.csv" -type f -not -path "./.git/*" -not -path "./output/*" | head -1)
          if [ -n "$CSV_FILES" ]; then
            INPUT_FILE="$CSV_FILES"
            echo "Found CSV file: $INPUT_FILE"
          else
            echo "❌ No CSV file found!"
            exit 1
          fi
        fi
        
        echo "input_file=$INPUT_FILE" >> $GITHUB_OUTPUT
        echo "INPUT_FILE_PATH=$INPUT_FILE" >> $GITHUB_ENV
    
    - name: Run feature engineering (CI)
      id: run-pipeline
      run: |
        # Check if main.py exists
        if [ ! -f "main.py" ]; then
          echo "❌ Error: main.py not found!"
          echo "Available Python files:"
          ls -la *.py
          exit 1
        fi
        
        echo "🚀 Starting CI pipeline..."
        
        # Run with force flag if requested
        if [ "${{ github.event.inputs.force_process }}" == "true" ]; then
          python main.py "${{ steps.input-file.outputs.input_file }}" --force
        else
          python main.py "${{ steps.input-file.outputs.input_file }}"
        fi
        
        echo "✅ CI pipeline completed"
      continue-on-error: true
    
    - name: Handle CI failure
      if: failure() && github.event_name != 'workflow_dispatch'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const commitSha = process.env.GITHUB_SHA;
          const runUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          
          try {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI Pipeline Failed - ${new Date().toLocaleString()}`,
              body: `## ❌ CI Pipeline Failure
              
              The feature engineering CI pipeline failed.
              
              **Commit:** ${commitSha}
              **Run:** ${runUrl}
              **Input file:** ${process.env.INPUT_FILE_PATH || 'Not specified'}
              
              Please check the logs for details.`,
              labels: ['bug', 'ci-failure']
            });
            console.log('✅ Created issue for CI failure');
          } catch (error) {
            console.log('⚠️ Could not create issue:', error.message);
          }
    
    - name: Upload artifacts (CD)
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: feature-engineered-data
        path: output/
        retention-days: 7
    
    - name: Deploy results (optional CD)
      if: success()
      run: |
        echo "📦 Preparing deployment..."
        if [ -d "output" ]; then
          echo "✅ Output directory ready for deployment"
          echo "Files available:"
          ls -la output/
          
          # Optional: Add deployment steps here
          # For example, upload to cloud storage, notify team, etc.
        fi