name: Feature Engineering Pipeline

on:
  push:
    paths:
      - 'input/*.csv'
      - '**/*.py'
      - 'requirements.txt'
  workflow_dispatch:
    inputs:
      force_process:
        description: 'Force process even if files unchanged'
        required: false
        default: 'false'
        type: boolean

# Add permissions to create issues
permissions:
  contents: write
  issues: write  # This is important!
  pull-requests: write

jobs:
  feature-engineering:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy scikit-learn matplotlib seaborn
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
    
    - name: List input files
      run: |
        echo "📁 Available CSV files:"
        find . -name "*.csv" -type f -not -path "./.git/*" | head -10
        echo ""
        echo "📂 Input directory contents:"
        ls -la input/ || echo "No input directory found"
    
    - name: Determine input file
      id: input-file
      run: |
        # Check if workflow_dispatch provided a file
        if [ "${{ github.event.inputs.csv_file }}" != "" ]; then
          INPUT_FILE="${{ github.event.inputs.csv_file }}"
          echo "Using workflow_dispatch input: $INPUT_FILE"
        else
          # Look for CSV files
          if [ -d "input" ] && [ -n "$(ls -A input/*.csv 2>/dev/null)" ]; then
            INPUT_FILE=$(ls input/*.csv | head -1)
            echo "Found CSV file: $INPUT_FILE"
          else
            # Look anywhere in repo
            CSV_FILES=$(find . -name "*.csv" -type f -not -path "./.git/*" -not -path "./output/*" | head -1)
            if [ -n "$CSV_FILES" ]; then
              INPUT_FILE="$CSV_FILES"
              echo "Found CSV file: $INPUT_FILE"
            else
              echo "❌ No CSV file found!"
              exit 1
            fi
          fi
        fi
        
        echo "input_file=$INPUT_FILE" >> $GITHUB_OUTPUT
        echo "INPUT_FILE_PATH=$INPUT_FILE" >> $GITHUB_ENV
    
    - name: Run feature engineering
      id: feature-engineering
      run: |
        # Run with force flag if requested
        if [ "${{ github.event.inputs.force_process }}" == "true" ]; then
          python feature_engineering.py "${{ steps.input-file.outputs.input_file }}" --force
        else
          python feature_engineering.py "${{ steps.input-file.outputs.input_file }}"
        fi
      continue-on-error: true
    
    - name: Handle pipeline failure
      if: failure() && github.event_name != 'workflow_dispatch'
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        script: |
          const fs = require('fs');
          const commitSha = process.env.GITHUB_SHA;
          const runUrl = `https://github.com/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
          
          try {
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Pipeline Failure Alert - ${new Date().toLocaleString()}`,
              body: `## ⚠️ Pipeline Failure Alert
              
              The feature engineering pipeline failed.
              
              **Commit:** ${commitSha}
              **Run:** ${runUrl}
              **Input file:** ${process.env.INPUT_FILE_PATH || 'Not specified'}
              
              Please check the logs for details.`,
              labels: ['bug', 'automated-report']
            });
            console.log('✅ Created issue');
          } catch (error) {
            console.log('⚠️ Could not create issue:', error.message);
            // Don't fail the workflow if issue creation fails
          }
    
    - name: Upload processed files
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: feature-engineered-data
        path: output/
        retention-days: 7
    
    - name: Commit processed files (optional)
      if: success()
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git add output/
        git diff --quiet && git diff --staged --quiet || git commit -m "Auto-update: Feature engineering results [skip ci]"
        git push || echo "No changes to push"