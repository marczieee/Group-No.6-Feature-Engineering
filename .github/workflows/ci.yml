name: Group 6 - Feature Engineering CI Pipeline

on:
  push:
    branches: [ main ]
    paths:
      - 'input/**'
      - '**.py'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:  # Allow manual trigger

permissions:
  contents: write

jobs:
  feature-engineering-pipeline:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      
      - name: 🐍 Set Up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas numpy pytest
      
      - name: 📁 Create Required Folders
        run: |
          mkdir -p input
          mkdir -p output
          mkdir -p tests
      
      - name: 🔍 List Input Files
        run: |
          echo "📋 Input files to process:"
          ls -lh input/*.csv 2>/dev/null || echo "⚠️  No CSV files found in input/ folder"
      
      - name: ⚙️ Run Feature Engineering Pipeline
        env:
          CI: true
        run: |
          python main.py
      
      - name: 📊 Display Output Summary
        if: always()
        run: |
          echo "📁 Generated outputs:"
          find output -type f -name "*.csv" -exec ls -lh {} \; 2>/dev/null || echo "No output files generated"
          
          echo ""
          echo "📂 Output directory structure:"
          tree output -L 2 2>/dev/null || find output -type d 2>/dev/null || echo "Output directory empty"
      
      - name: 🧪 Run PyTest Tests
        if: always()
        run: |
          if [ -f tests/test_functions.py ]; then
            pytest tests/test_functions.py -v --tb=long
          else
            echo "⚠️  Test file not found, skipping tests"
          fi
      
      - name: 💾 Commit Output Files
        if: success()
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Add all output files
          git add output/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "✅ No new changes to commit"
          else
            # Create timestamp
            echo "Last updated: $(date)" > output/.timestamp
            git add output/.timestamp
            
            # Commit with detailed message
            COMMIT_MSG="CI: Auto-generated output CSV files - $(date +'%Y-%m-%d %H:%M:%S')"
            git commit -m "$COMMIT_MSG"
            
            # Pull and push with retry logic
            for i in {1..3}; do
              git pull --rebase origin main && break
              echo "⚠️  Pull attempt $i failed, retrying..."
              sleep 2
            done
            
            git push origin main || echo "⚠️  Push failed - may need manual intervention"
            echo "✅ Successfully committed and pushed output files"
          fi
      
      - name: 📤 Upload Output Artifacts
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: feature-engineering-outputs
          path: output/
          retention-days: 30
      
      - name: 📝 Create Job Summary
        if: always()
        run: |
          echo "## 🎯 Feature Engineering Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Count input files
          INPUT_COUNT=$(ls input/*.csv 2>/dev/null | wc -l)
          echo "- 📥 **Input files processed:** $INPUT_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # Count output files
          OUTPUT_COUNT=$(find output -name "*.csv" 2>/dev/null | wc -l)
          echo "- 📤 **Output files generated:** $OUTPUT_COUNT" >> $GITHUB_STEP_SUMMARY
          
          # List input files
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Input Files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh input/*.csv 2>/dev/null || echo "No CSV files" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          
          # Show output structure
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Output Structure" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tree output -L 2 2>/dev/null || find output -type f 2>/dev/null || echo "No outputs" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
